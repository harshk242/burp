name: Deploy

# Continuous deployment: every push to main (i.e. a merged develop -> main
# release PR) runs the unit tests, deploys that exact commit to Fly.io, then
# publishes a date-tagged GitHub Release with notes generated by git-cliff.
# To redeploy a commit, re-run this workflow's run from the Actions tab.
#
# Requires repo secret FLY_API_TOKEN (fly tokens create deploy -a super-bio-agent).

on:
  push:
    branches: [main]

# Never run two deploys at once (single machine + SQLite volume); queue instead.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy to Fly.io
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Build on Fly's remote builder from the checked-out origin/main commit.
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  release:
    name: Publish GitHub release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so notes start at the last release

      # vYYYY.MM.DD (UTC); a second release the same day gets .2, then .3, ...
      - name: Compute release tag
        id: version
        run: |
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            n=$((n + 1))
            tag="$base.$n"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "Maintenance release (no user-facing changes)." > RELEASE_NOTES.md
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file RELEASE_NOTES.md
