name: Deploy

# Continuous deployment: every push to main (i.e. a merged develop -> main
# release PR) runs the unit tests, then deploys that exact commit to Fly.io.
# To redeploy a commit, re-run this workflow's run from the Actions tab.
#
# Requires repo secret FLY_API_TOKEN (fly tokens create deploy -a super-bio-agent).

on:
  push:
    branches: [main]

# Never run two deploys at once (single machine + SQLite volume); queue instead.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy to Fly.io
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Build on Fly's remote builder from the checked-out origin/main commit.
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
