name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  workflow_call:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Typecheck mcp-server
        working-directory: mcp-server
        run: bunx tsc --noEmit --project tsconfig.json

      - name: Run mcp-server unit tests
        working-directory: mcp-server
        run: bunx vitest run --reporter=verbose

      - name: Typecheck app
        working-directory: app
        run: bun run typecheck

      - name: Check Drizzle migrations are consistent
        working-directory: app
        run: bunx drizzle-kit check

      - name: Drizzle schema drift guard
        working-directory: app
        run: |
          bunx drizzle-kit generate
          git diff --exit-code -- server/db/migrations
          if [ -n "$(git status --porcelain -- server/db/migrations)" ]; then
            git status --porcelain -- server/db/migrations
            echo "::error::Schema changed without a committed migration. Run 'bun run db:generate --name <change>' and commit the output."
            exit 1
          fi

      - name: Run app tests
        working-directory: app
        run: bun test

  # Builds and boots the production image (Deploy calls this workflow, so it gates every deploy).
  # In a workflow_call run, github.* describes the caller's push to main.
  image-smoke:
    name: Image Smoke Test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.base_ref == 'main' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build and smoke-test production image
        run: bun run smoke:image

  contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install mcp-server dependencies
        working-directory: mcp-server
        run: bun install

      - name: Run contract tests
        working-directory: mcp-server
        run: bunx vitest run --config vitest.contracts.config.ts --reporter=verbose
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}

      - name: Upload drift report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract-drift-report
          path: mcp-server/src/platforms/__test-utils__/fixtures/
          retention-days: 14

  # Unit tests mock HTTP, so they cannot tell whether the live API accepts a request
  # (e.g. ClinicalTrials.gov rejecting `filter.phase` with HTTP 400). Run the live
  # contract tests of any platform a PR touches, instead of waiting for the nightly run.
  changed-platform-contracts:
    name: Contract Tests (changed platforms)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    # Live APIs can be flaky; surface failures as a warning instead of blocking merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find changed platforms
        id: changed
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- mcp-server/src/platforms/)
          if echo "$changed" | grep -q '^mcp-server/src/platforms/__test-utils__/'; then
            dirs="src/platforms"
          else
            dirs=$(echo "$changed" | sed -n 's#^mcp-server/\(src/platforms/[^/]*\)/.*#\1#p' | sort -u \
              | while read -r d; do ls "mcp-server/$d"/__tests__/*.contract.ts >/dev/null 2>&1 && echo "$d"; done | xargs)
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Platforms with contract tests to run: ${dirs:-none}"

      - uses: oven-sh/setup-bun@v2
        if: steps.changed.outputs.dirs != ''
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.dirs != ''
        with:
          node-version: '24'

      - name: Install mcp-server dependencies
        if: steps.changed.outputs.dirs != ''
        working-directory: mcp-server
        run: bun install

      - name: Run contract tests for changed platforms
        if: steps.changed.outputs.dirs != ''
        working-directory: mcp-server
        run: bunx vitest run --config vitest.contracts.config.ts --reporter=verbose ${{ steps.changed.outputs.dirs }}
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
