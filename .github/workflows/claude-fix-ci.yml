name: Claude Fix CI

# Runs after the "Tests" workflow finishes. If it failed on develop (push or
# daily schedule), Claude reads the failed job logs, fixes the root cause on a
# new branch, and opens a PR against develop. Feature-branch PR failures are
# ignored so fix PRs never carry unrelated feature commits.
#
# Note: workflow_run only fires for workflow files on the default branch,
# so this must be on develop (the default branch) to take effect.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write
  id-token: write # OIDC exchange for the Claude GitHub App token

concurrency:
  group: claude-fix-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Collect failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --log-failed | tail -c 80000 > "$RUNNER_TEMP/ci-failure.log"
          wc -c "$RUNNER_TEMP/ci-failure.log"

      - name: Configure git identity
        run: |
          git config --global user.name "claude[bot]"
          git config --global user.email "claude[bot]@users.noreply.github.com"

      - name: Analyze and fix with Claude
        uses: anthropics/claude-code-action@v1
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --model claude-sonnet-5-5
            --effort high
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(bun:*),Bash(bunx:*),Bash(git:*),Bash(gh:*),Bash(cat:*),Bash(tail:*),Bash(head:*)"
          prompt: |
            The "Tests" workflow failed in ${{ github.repository }}.

            - Failed run: ${{ github.event.workflow_run.html_url }}
            - Trigger event: ${{ github.event.workflow_run.event }}
            - Branch: ${{ github.event.workflow_run.head_branch }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Failed job logs: ${{ runner.temp }}/ci-failure.log

            Follow AGENTS.md. Your task:
            1. Read the failure log and identify which tests failed and why.
            2. Read the relevant source and test code. Find the root cause;
               do not weaken, skip, or delete tests to make them pass.
            3. Decide whether the failure is fixable in code. If it is caused
               by an external API outage, rate limit, or flaky network call,
               do NOT make changes; just explain your analysis and stop.
            4. Otherwise implement the fix and verify it by re-running the
               failing suite (mcp-server: `bunx vitest run`, contract tests:
               `bunx vitest run --config vitest.contracts.config.ts`,
               app: `bun test` in app/, typecheck: `bunx tsc --noEmit` in mcp-server/).
            5. Create branch `claude/fix-ci-${{ github.event.workflow_run.id }}`,
               commit with a Conventional Commit message, push it, and open a PR
               with `gh pr create --base develop`.
               The PR body must include: the failed run link, root-cause
               analysis, the fix, and the verification commands you ran.
