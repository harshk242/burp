          3. A recommendation of which two deserve further investigation under the stated objective, and why they outrank the alternatives. Recommend fewer if the evidence is insufficient.
          4. For each recommended target, one next experiment tied to an unresolved question and what result would change your recommendation.
          5. Sources linked to the claims they support, using PMIDs, DOIs, trial IDs, or database record links.

          If the case supplies a fixed candidate set and its own output structure, evaluate that set and follow the case's structure instead of expanding to five targets.

          Established targets are allowed. Do not claim novelty. Do not assign numerical probabilities of clinical success without a validated basis.

          Evaluate the following proposed interventions in moderate-to-severe active Crohn's disease:

          - Inhibition of IL17A.
          - Inhibition of IL23A.

          Assess both using the same criteria and comparable search effort.

          For each, separate:
          1. Biological rationale.
          2. Disease-specific human intervention evidence.
          3. Safety findings.
          4. What remains uncertain.

          Recommend pursue, deprioritize, or insufficient evidence for each. Explain the strongest evidence against your own recommendation.

          Do not assume these interventions should receive the same decision because their targets participate in related immune biology.
    expected_output:
      checkpoints:
        - turn: 1
          any_of: [["IL23", "IL-23", "IL23A", "IL-23p19", "p19", risankizumab, guselkumab, mirikizumab]]
          min_hits: 1
        - turn: 1
          any_of: [[secukinumab, "22595313"]]
          min_hits: 1
      expected_tools_any: ["open-targets__*", "pubmed__*", "clinicaltrials__*"]
      must_not:
        - "gives IL17A and IL23A inhibition the same decision because their targets share immune biology"
        - "omits the decisive unfavorable secukinumab Crohn's evidence"
        - "infers that every IL-17 pathway molecule or patient subgroup has been tested"
      key_references: ["PMID:35644154", "PMID:22595313"]
      reference_answer: null
    metadata:
      category: target-selection
      turns: single
      difficulty: hard
      volatile: false
      source: target-selection-pack
      reviewed_by: null
      notes: >-
        Fixed comparison: distinguish supportive IL23A inhibition evidence from unfavorable IL17A blockade evidence in Crohn's, with study context and limits. Omitting decisive unfavorable evidence undermines the task.
      prompt_version: v1
      source_files:
        - experiments/target-selection-validation/instructions.md
        - experiments/target-selection-validation/prompts/04-controlled-comparison.md

  - id: ts-05-audit-crohns
    input:
      turns:
        - |-
          You are supporting a drug-discovery team's target-selection review.

          Use the connected databases to retrieve evidence. Distinguish retrieved facts from your interpretation and from anything you cannot verify.

          Rules:
          - Resolve the disease and gene/protein identifiers.
