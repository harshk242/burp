          If the case supplies a fixed candidate set and its own output structure, evaluate that set and follow the case's structure instead of expanding to five targets.

          Established targets are allowed. Do not claim novelty. Do not assign numerical probabilities of clinical success without a validated basis.

          Disease setting: adults with moderate-to-severe active Crohn's disease.

          Identify targets for pharmacological intervention. Both biologics and small molecules are in scope.

          Give particular attention to whether a mechanism supported in another inflammatory disease is supported in Crohn's disease itself.

          In addition to your shortlist, identify one biologically plausible intervention that should be deprioritized because of disease-specific counterevidence. Retrieve that evidence and explain its limits.
        - |-
          Audit your previous target-selection recommendation.

          Choose the five claims that most influenced your ranking. For each:
          - Re-open the supporting source.
          - State exactly what was observed and in which population or model.
          - Explain whether it supports association, causal involvement, intervention direction, or therapeutic efficacy.
          - Identify any inference you added beyond the reported observation.
          - Check whether the same underlying study was counted more than once.

          Then search for the strongest disease-specific evidence that could overturn the top recommendation.

          Revise the ranking only if the evidence warrants it. State what changed, or explain why the ranking remains justified.

          Do not treat this self-audit as independent validation.
    expected_output:
      checkpoints:
        - turn: 1
          any_of: [["IL23", "IL-23", "IL23A", "IL-23p19", "p19", risankizumab, guselkumab, mirikizumab]]
          min_hits: 1
        - turn: 2
          any_of: [["IL23", "IL-23", "IL23A", "IL-23p19", "p19", risankizumab, guselkumab, mirikizumab]]
          min_hits: 1
      expected_tools_any: ["pubmed__*"]
      must_not:
        - "changes a supported ranking only because it was challenged"
        - "treats the self-audit as independent validation"
        - "counts the same underlying study more than once"
      key_references: ["PMID:35644154", "PMID:22595313"]
      reference_answer: null
    metadata:
      category: target-selection
      turns: multi
      difficulty: hard
      volatile: false
      source: target-selection-pack
      reviewed_by: null
      notes: >-
        Audit (case 05) of a case 03 parent in the same conversation; no shared preamble on turn 2. Decisive claims re-checked against source observations, duplicates recognized; a supported conclusion need not change.
      prompt_version: v1
      source_files:
        - experiments/target-selection-validation/instructions.md
        - experiments/target-selection-validation/prompts/03-crohns.md
        - experiments/target-selection-validation/prompts/05-evidence-audit.md
