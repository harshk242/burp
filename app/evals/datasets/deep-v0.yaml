    expected_output:
      checkpoints:
        - turn: 1
          any_of: [["IL23", "IL-23", "IL23A", "IL-23p19", "p19", risankizumab, guselkumab, mirikizumab]]
          min_hits: 1
        - turn: 1
          any_of: [["IL17A", "IL-17A", secukinumab]]
          min_hits: 1
      expected_tools_any: ["open-targets__*", "pubmed__*", "clinicaltrials__*"]
      must_not:
        - "transfers the psoriasis IL-17A rationale to Crohn's disease without disease-specific evidence"
        - "omits the negative secukinumab Crohn's trial"
      key_references: ["PMID:35644154", "PMID:22595313"]
      reference_answer: null
    metadata:
      category: target-selection
      turns: single
      difficulty: hard
      volatile: false
      source: target-selection-pack
      reviewed_by: null
      notes: >-
        IL-23 inhibition has supportive human intervention evidence (risankizumab ADVANCE/MOTIVATE). IL-17A blockade (secukinumab) was ineffective in Crohn's with more adverse events; the natural deprioritization pick.
      prompt_version: v1
      source_files:
        - experiments/target-selection-validation/instructions.md
        - experiments/target-selection-validation/prompts/03-crohns.md

