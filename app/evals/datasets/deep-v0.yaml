          4. For each recommended target, one next experiment tied to an unresolved question and what result would change your recommendation.
          5. Sources linked to the claims they support, using PMIDs, DOIs, trial IDs, or database record links.

          If the case supplies a fixed candidate set and its own output structure, evaluate that set and follow the case's structure instead of expanding to five targets.

          Established targets are allowed. Do not claim novelty. Do not assign numerical probabilities of clinical success without a validated basis.

          Disease setting: adults with moderate-to-severe plaque psoriasis.

          Identify targets for systemic pharmacological intervention. Both biologics and small molecules are in scope.

          Compare disease-specific human evidence, intervention direction, selectivity, tractability, and safety considerations.

          Where targets participate in the same pathway, explain whether intervening at different points is supported by equivalent evidence. Do not assume that blocking a ligand, receptor, or downstream signaling protein produces interchangeable effects.
    expected_output:
      checkpoints:
        - turn: 1
          any_of: [["IL17A", "IL-17A", secukinumab]]
          min_hits: 1
      expected_tools_any: ["open-targets__*", "pubmed__*"]
      must_not:
        - "treats ligand, receptor and downstream signaling targets in one pathway as interchangeable"
        - "claims full-text access when only an abstract was retrieved"
      key_references: ["PMID:25007392"]
      reference_answer: null
    metadata:
      category: target-selection
      turns: single
      difficulty: hard
      volatile: false
      source: target-selection-pack
      reviewed_by: null
      notes: >-
        A defensible case for IL-17A inhibition should be recoverable (secukinumab phase 3, 2014). Ligand, receptor and signaling targets must be distinguished.
      prompt_version: v1
      source_files:
        - experiments/target-selection-validation/instructions.md
        - experiments/target-selection-validation/prompts/02-psoriasis.md

