name: deep
description: >-
  Target-selection validation pack v1 (cases 01–05): retrieval, evidence synthesis,
  intervention direction, disease specificity and counterevidence handling. Run before releases.
run_defaults:
  concurrency: 1
  max_cost_usd: 20
items:
  - id: ts-01-cardiovascular
    input:
      turns:
        - |-
          You are supporting a drug-discovery team's target-selection review.

          Use the connected databases to retrieve evidence. Distinguish retrieved facts from your interpretation and from anything you cannot verify.

          Rules:
          - Resolve the disease and gene/protein identifiers.
          - Do not treat an association score, expression change, or pathway membership alone as proof that targeting a protein will help.
          - State the proposed intervention direction: inhibit, activate, restore function, or unresolved. Support that direction with evidence.
          - Trace evidence to original studies. The same study appearing through multiple databases counts once.
          - Retrieve the primary publication's abstract or available full text before using it for a decisive claim. State which you accessed.
          - Search for conflicting findings, failed interventions, and safety concerns. Distinguish missing evidence from negative evidence.
          - Do not equate a failed compound or terminated trial with a disproven target without examining the evidence.
          - Use relevant databases; there is no requirement to use all ten.
          - Report tool failures, incomplete retrieval, and important evidence gaps.

          For open candidate discovery, output:
          1. A shortlist of up to five targets with a brief selection rationale.
          2. A deeper comparison of the strongest three: target and identifier | intervention direction | strongest evidence | contradictory evidence or risk | tractability | unresolved question.
          3. A recommendation of which two deserve further investigation under the stated objective, and why they outrank the alternatives. Recommend fewer if the evidence is insufficient.
          4. For each recommended target, one next experiment tied to an unresolved question and what result would change your recommendation.
          5. Sources linked to the claims they support, using PMIDs, DOIs, trial IDs, or database record links.

          If the case supplies a fixed candidate set and its own output structure, evaluate that set and follow the case's structure instead of expanding to five targets.

          Established targets are allowed. Do not claim novelty. Do not assign numerical probabilities of clinical success without a validated basis.

          Disease setting: adults with elevated LDL cholesterol and atherosclerotic cardiovascular disease.

          Identify targets for pharmacological intervention to reduce LDL cholesterol and ultimately cardiovascular events.

          Consider multiple therapeutic modalities. Prioritize a coherent chain from human evidence to mechanism to intervention direction.

          Distinguish evidence for lowering LDL from evidence for reducing cardiovascular events. Explain which uncertainty remains for each target even when one of those outcomes is established.
    expected_output:
      checkpoints:
        - turn: 1
          any_of: [[PCSK9]]
          min_hits: 1
      expected_tools_any: ["open-targets__*", "pubmed__*"]
      must_not:
        - "equates LDL lowering with proven cardiovascular event reduction without distinguishing them"
        - "equates lifelong genetic LoF effects with a pharmacological intervention"
        - "claims full-text access when only an abstract was retrieved"
      key_references: ["DOI:10.1056/NEJMoa054013", "PMID:28304224"]
      reference_answer: null
    metadata:
      category: target-selection
      turns: single
      difficulty: hard
      volatile: false
      source: target-selection-pack
      reviewed_by: null
      notes: >-
        PCSK9 should be a strong candidate, with evidence for inhibition (Cohen 2006; FOURIER). Distinguish LDL lowering from CV outcomes and lifelong genetic effects from pharmacological intervention.
      prompt_version: v1
      source_files:
        - experiments/target-selection-validation/instructions.md
        - experiments/target-selection-validation/prompts/01-cardiovascular.md

