rate_limits:
  default_daily_tokens: 200000

usage:
  default_daily_cost_limit_usd: 4.00
  default_monthly_cost_limit_usd: 25.00
  max_chat_input_chars: 20000
  pricing:
    anthropic:
      claude-haiku-4-5:
        input_usd_per_mtok: 1.00
        output_usd_per_mtok: 5.00
        cache_read_usd_per_mtok: 0.10
        cache_write_5m_usd_per_mtok: 1.25
        cache_write_1h_usd_per_mtok: 2.00
      claude-sonnet-5-5:
        input_usd_per_mtok: 2.00
        output_usd_per_mtok: 10.00
        cache_read_usd_per_mtok: 0.10
        cache_write_5m_usd_per_mtok: 2.50
        cache_write_1h_usd_per_mtok: 4.00
      claude-opus-5-5:
        input_usd_per_mtok: 4.00
        output_usd_per_mtok: 20.00
        cache_read_usd_per_mtok: 0.20
        cache_write_5m_usd_per_mtok: 5.00
        cache_write_1h_usd_per_mtok: 8.00
      claude-haiku-5-5:
        input_usd_per_mtok: 0.10
        output_usd_per_mtok: 0.50
        cache_read_usd_per_mtok: 0.01
        cache_write_5m_usd_per_mtok: 0.125
        cache_write_1h_usd_per_mtok: 0.20
        long_context:
          above_input_tokens: 100000
          input_usd_per_mtok: 0.50
          output_usd_per_mtok: 2.50
          cache_read_usd_per_mtok: 0.05
          cache_write_5m_usd_per_mtok: 0.625
          cache_write_1h_usd_per_mtok: 1.00
    google:
      gemini-3-flash-preview:
        input_usd_per_mtok: 0.50
        output_usd_per_mtok: 3.00

llm:
  provider: anthropic
  chat_model: claude-sonnet-5-5
  title_model: claude-haiku-4-5
  max_retries: 3
  max_output_tokens: 16000
  max_context_tokens: 180000
  thinking_display: summarized
  effort: medium
  max_tool_iterations: 20

server:
  port: 3000
  database_url: ./data/app.db
  mcp_servers_base: ../mcp-server
  mcp_tool_timeout_ms: 60000
  cors_origins:
    - http://localhost:3000
    - http://localhost:3001
    - http://192.168.0.27:3001
    - http://100.127.112.7:3001
  log_dir: ../logs
  log_level: DEBUG

tool_search:
  bm25_weight: 1.0
  semantic_weight: 1.0
  short_query_threshold: 4
  short_query_bm25_weight: 2.0
  top_k: 5
  candidate_k: 30
  embeddings_path: ./data/tool-embeddings.json

embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536
  query_timeout_ms: 2000
  sync_on_boot: true
  sync_timeout_ms: 120000

platforms:
  ensembl:
    enabled: true
    always_loaded_tools:
      - search_genes
      - get_xrefs

  open-targets:
    enabled: true
    always_loaded_tools:
      - search_entities

  chembl:
    enabled: true
    always_loaded_tools:
      - search_compounds

  pubchem:
    enabled: true
    always_loaded_tools:
      - search_by_smiles

  clinvar:
    enabled: true
    always_loaded_tools:
      - lookup_by_rsid

  reactome:
    enabled: true
    always_loaded_tools: []

  clinicaltrials:
    enabled: true
    always_loaded_tools:
      - search_by_intervention
      - search_by_condition

  pubmed:
    enabled: true
    always_loaded_tools:
      - search_pubmed

  clinpgx:
    enabled: true
    always_loaded_tools: []

  uniprot:
    enabled: false
    always_loaded_tools:
      - search_by_gene
      - get_external_references

artifact:
  inline_max_chars: 15000
  hard_cap_bytes: 1048576
  ttl_minutes: 5
  db_ttl_hours: 24
  max_session_bytes: 20971520
  preview_sample_items: 2
  preview_max_chars_per_value: 150
  jq_timeout_ms: 5000
  jq_max_output_chars: 50000

  policies:
    global:
      noise_filters:
        - "del(.. | nulls)"

    platforms:
      uniprot:
        noise_filters:
          - "if .results then .results |= map(del(.sequence.value)) else del(.sequence.value) end"
          - "del(.. | .evidences?)"
          - "if .results then .results |= .[:10] else . end"
      chembl:
        noise_filters:
          - "if .molecules then .molecules |= .[:25] else . end"
          - "if .activities then .activities |= .[:25] else . end"

    tools: {}

    profiles: {}

observability:
  langfuse:
    enabled: true
    environment: dev
    full_generation_input: false
