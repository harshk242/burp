# Fly.io configuration for BURP
app = "super-bio-agent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[build.args]
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsudHJ5YnVycC5jb20k"
  NEXT_PUBLIC_API_URL = "https://tryburp.com"

[env]
  PORT = "3000"
  DATABASE_URL = "/app/data/app.db"
  MCP_SERVERS_BASE = "/app/mcp-server"
  NODE_ENV = "production"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    path = "/health"

[mounts]
  source = "bioagent_data"
  destination = "/app/data"
  size_gb = 1

[[vm]]
  size = "shared-cpu-4x"
  memory = "4gb"
